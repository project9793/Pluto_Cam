name: Build APK

on:
  push:
    paths:
      - 'android-native/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle
        run: |
          for i in 1 2 3 4 5; do
            curl -fsSL --retry 5 --retry-delay 3 -o /tmp/gradle.zip \
              "https://services.gradle.org/distributions/gradle-8.7-bin.zip" && break
            echo "attempt $i failed, retrying"; sleep 8
          done
          unzip -q /tmp/gradle.zip -d /opt
          echo "/opt/gradle-8.7/bin" >> "$GITHUB_PATH"
          /opt/gradle-8.7/bin/gradle --version | head -4

      - name: Build the APK
        run: |
          cd android-native
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          gradle :app:assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: pluto-live-apk
          path: android-native/app/build/outputs/apk/debug/*.apk

      - name: Publish release with the APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Pluto Live Cam build ${{ github.run_number }}
          files: android-native/app/build/outputs/apk/debug/*.apk
